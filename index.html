<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>功倍流程全解析 · 半岛家居</title>
<style>
:root{
  --bg:#0d1016; --panel:#141821; --panel2:#1a1f2b; --panel3:#202634;
  --bd:#252b38; --bd2:#2f3746;
  --tx:#dfe4ec; --tx2:#a8b2c4; --mu:#7b8698; --mu2:#5d6779;
  --gold:#f0b429; --blue:#4c8dff; --green:#34c77b; --red:#ff6b5e;
  --purple:#a072ff; --cyan:#39c5cf; --orange:#ff9f43;
  --r:8px; --mono:ui-monospace,Consolas,"Cascadia Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);
  font:13px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2b3342;border-radius:9px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3b4557}

/* ---------- header ---------- */
header{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:linear-gradient(180deg,#171c26,#12161e);border-bottom:1px solid var(--bd);position:relative;z-index:20}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;letter-spacing:.3px;white-space:nowrap}
.logo b{color:var(--gold);font-size:16px}
.logo .sub{font-weight:400;font-size:11px;color:var(--mu);padding-left:9px;border-left:1px solid var(--bd2)}
.kpis{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.kpi{background:var(--panel2);border:1px solid var(--bd);border-radius:6px;padding:3px 10px;
  display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.kpi i{font-style:normal;font-size:15px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--mu)}
.tabs{display:flex;gap:3px;background:var(--panel2);border:1px solid var(--bd);border-radius:7px;padding:2px}
.tabs button{background:none;border:0;color:var(--tx2);font:inherit;font-size:12px;
  padding:5px 13px;border-radius:5px;cursor:pointer;transition:.14s}
.tabs button:hover{color:var(--tx);background:#232a38}
.tabs button.on{background:var(--blue);color:#fff;font-weight:600}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:288px minmax(0,1fr) 470px;height:calc(100vh - 52px)}
main.wide{grid-template-columns:288px minmax(0,1fr) 0px}
.col{overflow-y:auto;overflow-x:hidden;position:relative}
#colTree{border-right:1px solid var(--bd);background:var(--panel)}
#colMain{background:var(--bg);padding:16px 18px 60px}
#colDetail{border-left:1px solid var(--bd);background:var(--panel);padding:0}
main.wide #colDetail{display:none}

/* ---------- tree ---------- */
.tsearch{padding:11px 12px;border-bottom:1px solid var(--bd);position:sticky;top:0;
  background:var(--panel);z-index:5}
.tsearch input{width:100%;background:var(--panel3);border:1px solid var(--bd2);color:var(--tx);
  font:inherit;font-size:12px;padding:7px 10px;border-radius:6px;outline:0}
.tsearch input:focus{border-color:var(--blue)}
.tsearch .hint{font-size:10px;color:var(--mu2);margin-top:5px}
.grp{border-bottom:1px solid #1b202b}
.grp>.gh{display:flex;align-items:center;gap:7px;padding:9px 12px;cursor:pointer;
  font-size:11px;font-weight:600;color:var(--tx2);letter-spacing:.4px;user-select:none}
.grp>.gh:hover{background:#181d27}
.grp>.gh .arw{color:var(--mu2);font-size:9px;transition:.18s;width:9px}
.grp.closed>.gh .arw{transform:rotate(-90deg)}
.grp.closed>.gb{display:none}
.grp>.gh .cnt{margin-left:auto;font-size:10px;color:var(--mu2);background:#1b2130;
  padding:1px 6px;border-radius:9px;font-variant-numeric:tabular-nums}
.grp>.gh .cnt.warn{color:var(--orange);background:#2a2114}
.proj{padding:0}
.ph{display:flex;align-items:flex-start;gap:7px;padding:8px 12px 8px 20px;cursor:pointer;
  font-size:12.5px;color:var(--tx2);user-select:none;transition:.12s}
.ph:hover{background:#181d27;color:var(--tx)}
.ph.on{background:#1c2431;color:#fff;box-shadow:inset 2px 0 0 var(--blue)}
.ph .star{color:var(--gold);font-size:11px;flex-shrink:0;line-height:1.7}
.ph .nm{flex:1;min-width:0}
.ph .nm .nf{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .nm .meta{font-size:10px;color:var(--mu2)}
.flows{padding:2px 0 6px}
.fl{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 38px;cursor:pointer;
  font-size:12px;color:var(--mu);transition:.12s;border-left:2px solid transparent}
.fl:hover{background:#181d27;color:var(--tx)}
.fl.on{background:#1c2431;color:#fff;border-left-color:var(--gold)}
.fl .dot{width:5px;height:5px;border-radius:50%;background:var(--mu2);flex-shrink:0}
.fl.on .dot{background:var(--gold)}
.fl .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .fc{font-size:10px;color:var(--mu2);font-variant-numeric:tabular-nums}

/* ---------- main / overview ---------- */
h1.pt{font-size:18px;font-weight:700;letter-spacing:.3px;margin-bottom:3px}
.pmeta{font-size:11.5px;color:var(--mu);margin-bottom:16px}
.pmeta code{font-family:var(--mono);background:#1b2130;padding:1px 5px;border-radius:4px;
  color:var(--cyan);font-size:11px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:11px 13px}
.card .n{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.card .l{font-size:11px;color:var(--mu);margin-top:2px}
.card.g .n{color:var(--gold)} .card.b .n{color:var(--blue)}
.card.gr .n{color:var(--green)} .card.p .n{color:var(--purple)}

h2.sec{font-size:13px;font-weight:700;color:var(--tx);margin:22px 0 10px;
  padding-bottom:7px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
h2.sec:first-child{margin-top:0}
h2.sec .tag{font-size:10px;font-weight:500;color:var(--mu);background:#1b2130;padding:1px 7px;border-radius:9px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-weight:600;font-size:11px;color:var(--mu);padding:7px 9px;
  background:#171c26;border-bottom:1px solid var(--bd);position:sticky;top:0;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid #1b202b;vertical-align:top;color:var(--tx2)}
tr:hover td{background:#171c26}
td.num{font-variant-numeric:tabular-nums;text-align:right;color:var(--tx)}
td.mono{font-family:var(--mono);font-size:11px;color:var(--cyan)}
.pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:9px;
  background:#1f2735;color:var(--tx2);white-space:nowrap;line-height:1.65}
.pill.gold{background:#2c2413;color:var(--gold)}
.pill.blue{background:#152439;color:var(--blue)}
.pill.green{background:#13291f;color:var(--green)}
.pill.red{background:#2d1a18;color:var(--red)}
.pill.purple{background:#221a35;color:var(--purple)}
.pill.orange{background:#2b2011;color:var(--orange)}

/* ---------- step timeline ---------- */
.flowhead{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);
  padding:13px 15px;margin-bottom:14px}
.flowhead .t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flowhead .s{font-size:11.5px;color:var(--mu);margin-top:4px}
.flowhead .s b{color:var(--tx2);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:8px;bottom:14px;width:2px;
  background:linear-gradient(180deg,var(--bd2),#1e2531)}
.step{position:relative;margin-bottom:9px}
.step::before{content:"";position:absolute;left:-22px;top:16px;width:9px;height:9px;
  border-radius:50%;background:var(--panel2);border:2px solid var(--mu2);z-index:2}
.step:hover::before{border-color:var(--blue)}
.step.on::before{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 3px #4c8dff2e}
.step.cond::before{border-color:var(--purple)}
.step.on.cond::before{background:var(--purple);border-color:var(--purple);box-shadow:0 0 0 3px #a072ff2e}
.sc{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);
  padding:11px 13px;cursor:pointer;transition:.14s}
.sc:hover{border-color:var(--bd2);background:var(--panel2)}
.step.on .sc{border-color:var(--blue);background:#151d2c}
.step.on.cond .sc{border-color:var(--purple);background:#1b1628}
.sc .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sc .idx{font-family:var(--mono);font-size:10.5px;color:var(--mu2);background:#1b2130;
  padding:1px 6px;border-radius:4px;font-weight:600}
.step.on .sc .idx{background:var(--blue);color:#fff}
.step.on.cond .sc .idx{background:var(--purple);color:#fff}
.sc .nm{font-size:13.5px;font-weight:600;color:var(--tx)}
.sc .desc{font-size:11.5px;color:var(--mu);margin-top:6px;white-space:pre-wrap;
  max-height:52px;overflow:hidden;line-height:1.65}
.step.on .sc .desc,.sc.descopen .desc{max-height:none}
.sc .bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.mini{font-size:10.5px;color:var(--mu);display:inline-flex;align-items:center;gap:4px;
  background:#1a1f2b;border:1px solid #232a38;padding:1px 8px;border-radius:11px}
.mini b{color:var(--tx2);font-weight:600}
.av{width:16px;height:16px;border-radius:50%;object-fit:cover;background:#2b3342;
  vertical-align:-3px;flex-shrink:0}
.avs{display:inline-flex;gap:-4px}
.avs .av{margin-left:-5px;border:1.5px solid var(--panel)}
.avs .av:first-child{margin-left:0}
.arrow{position:relative;height:14px;margin-left:2px}
.arrow::before{content:"↓";position:absolute;left:0;top:-2px;color:var(--mu2);font-size:11px}
.arrow .lbl{font-size:10px;color:var(--mu2);margin-left:14px;line-height:14px}

/* ---------- detail ---------- */
.dh{position:sticky;top:0;background:linear-gradient(180deg,#171c26,#141821);
  border-bottom:1px solid var(--bd);padding:13px 15px;z-index:6}
.dh .t{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dh .s{font-size:11px;color:var(--mu);margin-top:3px}
.dtabs{display:flex;gap:2px;margin-top:11px;background:var(--panel2);border-radius:6px;padding:2px}
.dtabs button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:11.5px;
  padding:5px 6px;border-radius:4px;cursor:pointer;transition:.13s;white-space:nowrap}
.dtabs button:hover{color:var(--tx)}
.dtabs button.on{background:var(--panel3);color:var(--tx);font-weight:600}
.db{padding:14px 15px 60px}
.empty{color:var(--mu2);font-size:12px;text-align:center;padding:44px 20px;line-height:1.9}
.empty .ic{font-size:30px;display:block;margin-bottom:10px;opacity:.45}

.blk{margin-bottom:17px}
.blk>h3{font-size:11px;font-weight:700;color:var(--mu);letter-spacing:.5px;
  margin-bottom:8px;display:flex;align-items:center;gap:7px}
.blk>h3::after{content:"";flex:1;height:1px;background:var(--bd)}
.kv{display:flex;gap:9px;font-size:12px;padding:5px 0;border-bottom:1px solid #1b202b}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--mu);min-width:74px;flex-shrink:0}
.kv .v{color:var(--tx2);flex:1;min-width:0;word-break:break-word}
.kv .v.mono{font-family:var(--mono);font-size:11px;color:var(--cyan)}
.descbox{background:var(--panel2);border-left:2px solid var(--bd2);border-radius:0 6px 6px 0;
  padding:9px 12px;font-size:12px;color:var(--tx2);white-space:pre-wrap;line-height:1.75}
.note{background:#1a1f2b;border-left:2px solid var(--orange);border-radius:0 6px 6px 0;
  padding:8px 11px;font-size:11.5px;color:var(--tx2);margin-bottom:9px}

/* fields */
.fld{background:var(--panel2);border:1px solid var(--bd);border-radius:7px;
  padding:9px 11px;margin-bottom:7px}
.fld .fh{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fld .fn{font-size:12.5px;font-weight:600;color:var(--tx)}
.fld .req{color:var(--red);font-weight:700}
.fld .fb{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.opts{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.opt{font-size:10.5px;background:#1f2735;color:var(--tx2);padding:1px 7px;border-radius:4px}
.opt.hi{background:#2c2413;color:var(--gold)}
.fld .tip{font-size:11px;color:var(--orange);margin-top:6px;display:flex;gap:5px;align-items:flex-start}
.fld .tip::before{content:"⚑";flex-shrink:0}

/* condition */
.condbox{background:#1a1526;border:1px solid #33284d;border-radius:8px;padding:11px 12px;margin-bottom:10px}
.condbox .ch{font-size:11px;font-weight:700;color:var(--purple);margin-bottom:8px;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.condbox .ch .ct{font-weight:500;color:var(--tx2);background:#241c38;padding:1px 7px;
  border-radius:9px;font-size:10.5px}
.cterm{background:#15121f;border-radius:5px;padding:6px 9px;margin-bottom:5px;font-size:11.5px;
  color:var(--tx2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cterm .cn{color:var(--tx);font-weight:600}
.cterm .cv{color:var(--gold)}
.noderow{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;background:#15121f;
  border-radius:6px;margin-top:5px}
.noderow .nn{font-size:12px;color:var(--tx);font-weight:600}
.noderow .nd{font-size:10.5px;color:var(--mu);margin-top:2px}
.nodego{color:var(--purple);font-size:11px;flex-shrink:0;margin-top:1px}

/* modal / misc */
.scroll-hint{font-size:10.5px;color:var(--mu2);padding:8px 15px;border-top:1px solid var(--bd);
  background:var(--panel);position:sticky;bottom:0}
mark{background:#4a3a10;color:var(--gold);border-radius:2px;padding:0 1px}
.footnote{font-size:11px;color:var(--mu2);line-height:1.85}
.footnote li{margin-left:16px;margin-bottom:3px}
.hr{height:1px;background:var(--bd);margin:16px 0}
.link{cursor:pointer;color:var(--blue)}
.link:hover{text-decoration:underline}
.qbadge{font-size:10px;background:#152439;color:var(--blue);padding:0 6px;border-radius:4px}
</style>
</head>
<body>
<header>
  <div class="logo"><b>◈</b>功倍流程全解析<span class="sub">半岛家居 · 日事清</span></div>
  <div class="tabs" id="viewTabs">
    <button data-v="tree" class="on">流程导航</button>
    <button data-v="ov">数据总览</button>
    <button data-v="ft">字段类型</button>
    <button data-v="usr">执行人</button>
    <button data-v="note">说明与局限</button>
  </div>
  <div class="kpis" id="kpis"></div>
</header>
<main id="main">
  <div class="col" id="colTree">
    <div class="tsearch">
      <input id="q" type="search" placeholder="搜索流程 / 步骤 / 字段…" autocomplete="off">
      <div class="hint" id="qhint"></div>
    </div>
    <div id="tree"></div>
  </div>
  <div class="col" id="colMain"></div>
  <div class="col" id="colDetail"></div>

<script>
/* 功倍流程浏览器 · 应用逻辑 */
(function () {
  "use strict";
  var D = window.GBFLOW;
  if (!D) { document.getElementById("colMain").innerHTML = '<div class="empty">数据未加载</div>'; return; }

  var M = D.meta, FT = D.fieldTypes || {};
  var flowById = {}, projByFlow = {}, formById = {};
  (D.flows || []).forEach(function (f) { flowById[f.applicationId] = f; });
  (D.projects || []).forEach(function (p) {
    (p.flows || []).forEach(function (fl) { (projByFlow[fl.applicationId] = projByFlow[fl.applicationId] || []).push(p); });
  });
  (D.flows || []).forEach(function (f) {
    (f.forms || []).forEach(function (fm) { formById[f.applicationId + "/" + fm.id] = fm; });
  });

  var state = { view: "tree", appid: null, stepId: null, dtab: "fields", q: "" };

  /* ---------- utils ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function hi(s) {
    var t = esc(s);
    if (!state.q) return t;
    try {
      return t.replace(new RegExp("(" + state.q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>");
    } catch (e) { return t; }
  }
  function shortId(u) { return u ? String(u).slice(0, 10) : ""; }
  function avatar(u) {
    if (!u || !u.avatar) return "";
    return '<img class="av" src="' + esc(u.avatar) + '" loading="lazy" alt="" title="' + esc(u.userId || u.name || "")
      + '" onerror="this.remove()">';
  }
  function avatars(list, max) {
    if (!list || !list.length) return '<span class="mini">未指定</span>';
    max = max || 5;
    var h = '<span class="avs">';
    list.slice(0, max).forEach(function (u) { h += avatar(u); });
    h += "</span>";
    var id = (list[0] || {}).userId;
    if (id) h += ' <span class="mono" style="font-size:9.5px;color:var(--mu)">' + esc(shortId(id)) + "…</span>";
    if (list.length > 1) h += ' <span style="font-size:10px;color:var(--mu2)">共' + list.length + "人</span>";
    return h;
  }
  function personLabel(u) {
    if (!u) return "—";
    if (u.name) return u.name;
    return '<span class="mono" style="font-size:10.5px">' + esc(shortId(u.userId)) + "…</span>";
  }
  function yesNo(v) { return v ? "是" : "否"; }

  /* ---------- KPI ---------- */
  function renderKPI() {
    var items = [
      ["starProjectCount", "星标项目"], ["starFlowCount", "流程"], ["starStepCount", "步骤"],
      ["starFieldCount", "审核字段"], ["starFormFieldCount", "表单字段"], ["allFlowCount", "含上下文流程"]
    ];
    document.getElementById("kpis").innerHTML = items.map(function (it) {
      return '<div class="kpi"><i>' + (M[it[0]] || 0) + "</i><span>" + it[1] + "</span></div>";
    }).join("");
  }

  /* ---------- 全文检索 ---------- */
  function hitCount(f, lq) {
    var n = 0;
    if ((f.name || "").toLowerCase().indexOf(lq) >= 0) n++;
    (f.steps || []).forEach(function (s) {
      if ((s.name || "").toLowerCase().indexOf(lq) >= 0) n++;
      if ((s.description || "").toLowerCase().indexOf(lq) >= 0) n++;
      (s.fields || []).forEach(function (fd) {
        if ((fd.name || "").toLowerCase().indexOf(lq) >= 0) n++;
        if ((fd.noticeContent || "").toLowerCase().indexOf(lq) >= 0) n++;
        (fd.options || []).forEach(function (o) { if ((o.name || "").toLowerCase().indexOf(lq) >= 0) n++; });
      });
      (s.conditions || []).forEach(function (c) {
        (c.conditions || []).forEach(function (cd) {
          if ((cd.name || "").toLowerCase().indexOf(lq) >= 0) n++;
          if ((cd.valueText || "").toLowerCase().indexOf(lq) >= 0) n++;
        });
        (c.auditNodes || []).forEach(function (nd) { if ((nd.name || "").toLowerCase().indexOf(lq) >= 0) n++; });
      });
    });
    return n;
  }

  function searchAll(lq) {
    var out = [];
    (D.flows || []).forEach(function (f) {
      var sh = [];
      (f.steps || []).forEach(function (s) {
        var hits = [];
        if ((s.name || "").toLowerCase().indexOf(lq) >= 0) hits.push({ k: "步骤名", t: s.name });
        if ((s.description || "").toLowerCase().indexOf(lq) >= 0) hits.push({ k: "步骤说明", t: s.description.slice(0, 130) });
        (s.fields || []).forEach(function (fd) {
          if ((fd.name || "").toLowerCase().indexOf(lq) >= 0) hits.push({ k: "字段", t: fd.name, ft: fd.typeText });
          if ((fd.noticeContent || "").toLowerCase().indexOf(lq) >= 0) hits.push({ k: "字段提示", t: fd.noticeContent.slice(0, 130) });
          (fd.options || []).forEach(function (o) { if ((o.name || "").toLowerCase().indexOf(lq) >= 0) hits.push({ k: "选项", t: o.name }); });
        });
        (s.conditions || []).forEach(function (c) {
          (c.conditions || []).forEach(function (cd) {
            if ((cd.name || "").toLowerCase().indexOf(lq) >= 0) hits.push({ k: "审核条件", t: cd.name });
            if ((cd.valueText || "").toLowerCase().indexOf(lq) >= 0) hits.push({ k: "条件值", t: cd.valueText });
          });
          (c.auditNodes || []).forEach(function (nd) { if ((nd.name || "").toLowerCase().indexOf(lq) >= 0) hits.push({ k: "审批节点", t: nd.name }); });
        });
        if (hits.length) sh.push({ step: s, hits: hits });
      });
      if (sh.length || (f.name || "").toLowerCase().indexOf(lq) >= 0) out.push({ flow: f, steps: sh });
    });
    out.sort(function (a, b) { return b.steps.length - a.steps.length; });
    return out;
  }

  function viewSearch(res, lq) {
    var total = res.reduce(function (a, r) { return a + r.steps.reduce(function (x, s) { return x + s.hits.length; }, 0); }, 0);
    var h = '<h1 class="pt">搜索「' + esc(state.q) + '」</h1>'
      + '<div class="pmeta">命中 <b style="color:var(--gold)">' + res.length + "</b> 条流程 · <b style=\"color:var(--gold)\">"
      + total + "</b> 处匹配（流程名 / 步骤名 / 步骤说明 / 字段名 / 字段提示 / 选项 / 审核条件 / 审批节点）</div>";
    if (!res.length) return h + '<div class="empty"><span class="ic">∅</span>没有找到匹配内容</div>';
    res.forEach(function (r) {
      h += '<div class="flowhead"><div class="t">' + esc(r.flow.name)
        + (r.flow.isStarFlow ? '<span class="pill gold">★ 星标</span>' : "")
        + '<span class="pill">' + r.steps.length + " 个步骤命中</span></div>"
        + '<div class="s">' + esc((r.flow.usedIn || []).map(function (u) { return u.projectName; }).join("、"))
        + ' · <span class="link" data-a="' + r.flow.applicationId + '">打开流程 →</span></div>';
      h += '<div style="margin-top:9px">';
      r.steps.forEach(function (sh) {
        h += '<div class="cterm" style="cursor:pointer" data-go="' + r.flow.applicationId + '|' + sh.step.id + '">'
          + '<span class="cn">' + esc(sh.step.order + ". " + sh.step.name) + "</span>"
          + '<span class="pill">' + sh.step.fieldCount + " 字段</span></div>";
        h += '<div style="margin:-2px 0 7px 12px">' + sh.hits.slice(0, 8).map(function (x) {
          return '<div style="font-size:11.5px;color:var(--tx2);padding:2px 0"><span class="pill blue">'
            + esc(x.k) + "</span> " + hi(x.t) + (x.ft ? ' <span class="pill">' + esc(x.ft) + "</span>" : "") + "</div>";
        }).join("") + (sh.hits.length > 8 ? '<div style="font-size:11px;color:var(--mu2)">…另有 ' + (sh.hits.length - 8) + " 处</div>" : "") + "</div>";
      });
      h += "</div></div>";
    });
    return h;
  }

  /* ---------- tree ---------- */
  function renderTree() {
    var q = state.q ? state.q.toLowerCase() : "";
    var html = "";
    (D.groups || []).forEach(function (g) {
      var projs = (D.projects || []).filter(function (p) { return p.groupId === g.id; });
      if (q) {
        projs = projs.filter(function (p) {
          if (p.name.toLowerCase().indexOf(q) >= 0) return true;
          return (p.flows || []).some(function (fl) {
            var f = flowById[fl.applicationId];
            return f && hitCount(f, q) > 0;
          });
        });
      }
      if (q && !projs.length) return;
      if (!q && !projs.length && !(g.uiCount > 0)) return;

      var crawled = g.crawledCount, ui = g.uiCount;
      var cntCls = (ui && ui !== crawled) ? "cnt warn" : "cnt";
      var cntTxt = (ui && ui !== crawled) ? crawled + "/" + ui : String(crawled);
      html += '<div class="grp' + (g.closed ? " closed" : "") + '" data-g="' + esc(g.id) + '">';
      html += '<div class="gh"><span class="arw">▼</span><span>' + (g.isStar ? "★ " : "") + esc(g.name) + "</span>";
      html += '<span class="' + cntCls + '" title="已抓取 / 平台显示">' + cntTxt + "</span></div>";
      html += '<div class="gb">';
      projs.forEach(function (p) {
        html += '<div class="proj"><div class="ph" data-p="' + p.id + '">';
        html += '<span class="star">' + (p.isStar ? "★" : "·") + "</span>";
        html += '<span class="nm"><span class="nf">' + hi(p.name) + "</span>";
        html += '<span class="meta">' + (p.workflowModuleCount || 0) + " 条流程 · 模块 " + (p.moduleCount || 0) + "</span></span></div>";
        html += '<div class="flows">';
        (p.flows || []).forEach(function (fl) {
          var f = flowById[fl.applicationId];
          if (!f) return;
          var hc = q ? hitCount(f, q) : 0;
          if (q && hc === 0 && f.name.toLowerCase().indexOf(q) < 0 && p.name.toLowerCase().indexOf(q) < 0) return;
          html += '<div class="fl' + (state.appid === fl.applicationId ? " on" : "") + '" data-a="' + fl.applicationId + '">';
          html += '<span class="dot"></span><span class="fn">' + hi(f.name) + "</span>";
          if (hc) html += '<span class="fc" style="color:var(--gold)">' + hc + " 命中</span>";
          else html += '<span class="fc">' + f.stepCount + "步</span>";
          html += "</div>";
        });
        html += "</div></div>";
      });
      html += "</div></div>";
    });
    document.getElementById("tree").innerHTML = html || '<div class="empty">无匹配结果</div>';

    document.querySelectorAll(".gh").forEach(function (el) {
      el.onclick = function () { el.parentNode.classList.toggle("closed"); };
    });
    document.querySelectorAll(".ph").forEach(function (el) {
      el.onclick = function (e) {
        e.stopPropagation();
        var p = el.parentNode;
        var fs = p.querySelector(".flows");
        if (fs) fs.style.display = fs.style.display === "none" ? "" : "none";
        el.classList.toggle("on");
      };
    });
    document.querySelectorAll(".fl").forEach(function (el) {
      el.onclick = function () {
        state.appid = el.getAttribute("data-a");
        state.stepId = null; state.view = "tree";
        document.querySelectorAll("#viewTabs button").forEach(function (b) { b.classList.toggle("on", b.dataset.v === "tree"); });
        renderTree(); renderMain(); renderDetail();
      };
    });
  }

  /* ---------- main ---------- */
  function syncWide() {
    var wide = (!!state.q && state.view === "tree") || state.view !== "tree";
    document.getElementById("main").classList.toggle("wide", wide);
  }

  function renderMain() {
    var el = document.getElementById("colMain");
    if (state.q && state.view === "tree") {
      el.innerHTML = viewSearch(searchAll(state.q.toLowerCase()));
      syncWide(); bindMain();
      return;
    }
    if (state.view === "ov") { el.innerHTML = viewOverview(); syncWide(); bindMain(); return; }
    if (state.view === "ft") { el.innerHTML = viewFieldTypes(); syncWide(); bindMain(); return; }
    if (state.view === "usr") { el.innerHTML = viewUsers(); syncWide(); bindMain(); return; }
    if (state.view === "note") { el.innerHTML = viewNotes(); syncWide(); bindMain(); return; }
    if (!state.appid) { el.innerHTML = viewHome(); syncWide(); bindMain(); return; }
    el.innerHTML = viewFlow(flowById[state.appid]);
    syncWide(); bindMain();
  }

  function viewHome() {
    var star = (D.flows || []).filter(function (f) { return f.isStarFlow; });
    return '<h1 class="pt">星标项目流程全解析</h1>'
      + '<div class="pmeta">数据源 <code>' + esc(M.source) + '</code> · 导出 ' + esc(M.exportedAt)
      + ' · 源页面 <a class="link" href="' + esc(M.sourceUrl) + '" target="_blank" rel="noreferrer">在功倍中打开 ↗</a></div>'
      + '<div class="cards">'
      + card("g", M.starProjectCount, "星标项目") + card("b", M.starFlowCount, "星标流程")
      + card("gr", M.starStepCount, "流程步骤") + card("p", M.starFieldCount, "审核字段")
      + card("", M.starFormFieldCount, "表单字段") + card("", (D.users || []).length, "涉及执行人")
      + "</div>"
      + '<h2 class="sec">星标项目的 ' + star.length + ' 条流程 <span class="tag">点击进入</span></h2>'
      + '<table><thead><tr><th>流程名称</th><th>所属项目</th><th class="num">步骤</th>'
      + '<th class="num">审核字段</th><th class="num">表单字段</th><th class="num">条件审核</th></tr></thead><tbody>'
      + star.map(function (f) {
        var cc = (f.steps || []).reduce(function (a, s) { return a + (s.conditionCount || 0); }, 0);
        return '<tr><td><span class="link" data-a="' + f.applicationId + '">' + esc(f.name) + "</span></td>"
          + "<td>" + esc((f.starProjects || []).join("、")) + "</td>"
          + '<td class="num">' + f.stepCount + '</td><td class="num">' + f.fieldCount + "</td>"
          + '<td class="num">' + (f.formFieldCount || 0) + "</td>"
          + '<td class="num">' + (cc ? '<span class="pill purple">' + cc + "</span>" : "—") + "</td></tr>";
      }).join("") + "</tbody></table>"
      + '<div class="hr"></div><div class="footnote">左栏按分组浏览全部 ' + M.allFlowCount
      + " 条流程（含 " + (M.allFlowCount - M.starFlowCount) + " 条非星标上下文流程）。</div>";
  }
  function card(cls, n, l) { return '<div class="card ' + cls + '"><div class="n">' + n + '</div><div class="l">' + l + "</div></div>"; }

  function viewFlow(f) {
    if (!f) return '<div class="empty">未找到流程</div>';
    var condSteps = (f.steps || []).filter(function (s) { return s.conditionCount; }).length;
    var h = '<div class="flowhead"><div class="t">' + esc(f.name)
      + (f.isStarFlow ? '<span class="pill gold">★ 星标</span>' : '<span class="pill">上下文</span>')
      + "</div><div class=\"s\">流程 ID <b>" + esc(f.applicationId) + "</b> · 用于 <b>"
      + esc((f.starProjects || []).map(function (x) { return x; }).join("、") || ((f.usedIn || [])[0] || {}).projectName || "—") + "</b></div>"
      + '<div class="chips">'
      + '<span class="mini"><b>' + f.stepCount + "</b> 步骤</span>"
      + '<span class="mini"><b>' + f.fieldCount + "</b> 审核字段</span>"
      + '<span class="mini"><b>' + (f.formFieldCount || 0) + "</b> 表单字段</span>"
      + '<span class="mini"><b>' + f.formCount + "</b> 表单</span>"
      + (condSteps ? '<span class="mini" style="color:#a072ff"><b>' + condSteps + "</b> 步含条件审核</span>" : "")
      + '<span class="mini">流转：<b>线性顺序</b></span>'
      + "</div></div>";
    h += '<h2 class="sec">流程步骤 <span class="tag">点击查看字段与流转</span></h2><div class="tl">';
    (f.steps || []).forEach(function (s, i) {
      var isOn = state.stepId === s.id;
      h += '<div class="step' + (isOn ? " on" : "") + (s.conditionCount ? " cond" : "") + '" data-s="' + s.id + '">';
      h += '<div class="sc"><div class="top"><span class="idx">' + String(s.order).padStart(2, "0") + "</span>";
      h += '<span class="nm">' + hi(s.name) + "</span>";
      if (s.conditionCount) h += '<span class="pill purple">条件审核 ' + s.conditionCount + "</span>";
      else h += '<span class="pill green">' + esc(s.auditModeText || "简单审核") + "</span>";
      if (s.formName) h += '<span class="pill blue">表单 ' + esc(s.formName) + "</span>";
      h += "</div>";
      if (s.description) h += '<div class="desc">' + hi(s.description) + "</div>";
      h += '<div class="bar">';
      if ((s.executors || []).length) {
        h += '<span class="mini">执行人 ' + avatars(s.executors, 4) + "</span>";
      } else if (s.conditionCount) {
        h += '<span class="mini">执行人 <span style="color:#a072ff">按条件指定 · 见条件审核</span></span>';
      } else {
        h += '<span class="mini">执行人 <span style="color:var(--mu2)">未指定</span></span>';
      }
      if (s.limitTime && s.limitTime.text) h += '<span class="mini">限时 <b>' + esc(s.limitTime.text) + "</b>（" + esc(s.limitTime.typeText || "") + "起算）</span>";
      h += '<span class="mini">字段 <b>' + s.fieldCount + "</b></span>";
      if (s.approverSummary) h += '<span class="mini" style="color:#a072ff">审批 <b>' + esc(s.approverSummary) + "</b></span>";
      h += "</div></div></div>";
      if (i < f.steps.length - 1) h += '<div class="arrow"><span class="lbl">' + (i === 0 ? "顺序流转" : "") + "</span></div>";
    });
    h += "</div>";
    return h;
  }

  function bindMain() {
    document.querySelectorAll("#colMain [data-s]").forEach(function (el) {
      el.onclick = function () {
        state.stepId = +el.getAttribute("data-s"); state.dtab = "fields";
        renderMain(); renderDetail(); scrollDetail();
      };
    });
    document.querySelectorAll("#colMain [data-go]").forEach(function (el) {
      el.onclick = function () {
        var parts = String(el.getAttribute("data-go")).split("|");
        state.appid = parts[0];
        state.stepId = +parts[1];
        state.q = "";
        document.getElementById("q").value = "";
        document.getElementById("qhint").textContent = "";
        state.view = "tree";
        document.querySelectorAll("#viewTabs button").forEach(function (b) { b.classList.toggle("on", b.dataset.v === "tree"); });
        renderTree(); renderMain(); renderDetail(); scrollDetail();
      };
    });
    document.querySelectorAll("#colMain [data-a]").forEach(function (el) {
      el.onclick = function () {
        state.appid = el.getAttribute("data-a"); state.stepId = null; state.view = "tree";
        state.q = ""; document.getElementById("q").value = ""; document.getElementById("qhint").textContent = "";
        document.querySelectorAll("#viewTabs button").forEach(function (b) { b.classList.toggle("on", b.dataset.v === "tree"); });
        renderTree(); renderMain(); renderDetail();
      };
    });
  }

  function scrollDetail() { document.getElementById("colDetail").scrollTop = 0; }

  /* ---------- detail ---------- */
  function renderDetail() {
    var el = document.getElementById("colDetail");
    if (state.view !== "tree") {
      el.innerHTML = '<div class="dh"><div class="t">' + esc(
        { ov: "数据总览", ft: "字段类型对照", usr: "执行人索引", note: "说明与局限" }[state.view] || "") + "</div></div>"
        + '<div class="empty"><span class="ic">◧</span>切回「流程导航」查看步骤详情</div>';
      syncWide();
      return;
    }
    if (state.q) {
      var res = searchAll(state.q.toLowerCase());
      var tot = res.reduce(function (a, r) { return a + r.steps.reduce(function (x, s) { return x + s.hits.length; }, 0); }, 0);
      el.innerHTML = '<div class="dh"><div class="t">搜索结果</div><div class="s">「' + esc(state.q) + "」命中 "
        + res.length + " 条流程 / " + tot + " 处</div></div>"
        + '<div class="empty" style="padding-top:26px"><span class="ic">⌕</span>点「打开流程 →」查看完整步骤与字段<br>'
        + '<span style="font-size:11px;color:var(--mu2)">清空搜索框返回流程导航</span></div>';
      syncWide();
      return;
    }
    var f = state.appid ? flowById[state.appid] : null;
    if (!f) { el.innerHTML = '<div class="empty"><span class="ic">⇠</span>从左侧选择一条流程<br>再点击步骤查看详情</div>'; return; }
    var s = null;
    (f.steps || []).forEach(function (x) { if (x.id === state.stepId) s = x; });
    if (!s) {
      el.innerHTML = '<div class="dh"><div class="t">' + esc(f.name) + '</div><div class="s">共 ' + f.stepCount
        + " 步 · 点击中栏任一步骤查看字段与流转</div></div>"
        + '<div class="empty"><span class="ic">☜</span>选择步骤</div>';
      return;
    }

    var tabs = [["fields", "字段（" + s.fieldCount + "）"], ["cond", "条件审核" + (s.conditionCount ? "（" + s.conditionCount + "）" : "")],
    ["flowline", "流转"], ["raw", "原始信息"]];
    var h = '<div class="dh"><div class="t"><span class="idx" style="font-family:var(--mono);font-size:11px;'
      + 'background:#1b2130;padding:1px 7px;border-radius:4px">' + String(s.order).padStart(2, "0") + "</span>"
      + esc(s.name) + "</div>";
    h += '<div class="s">' + esc(s.auditModeText || "") + " · 字段 " + s.fieldCount + " · 表单 "
      + esc(s.formName || "—") + (s.formFieldCount ? "（" + s.formFieldCount + " 字段）" : "") + "</div>";
    h += '<div class="dtabs">' + tabs.map(function (t) {
      return '<button data-dt="' + t[0] + '"' + (state.dtab === t[0] ? ' class="on"' : "") + ">" + t[1] + "</button>";
    }).join("") + "</div></div><div class=\"db\">";

    if (state.dtab === "fields") h += dFields(f, s);
    else if (state.dtab === "cond") h += dCond(s);
    else if (state.dtab === "flowline") h += dFlowline(f, s);
    else h += dRaw(s);
    h += "</div>";
    el.innerHTML = h;

    el.querySelectorAll("[data-dt]").forEach(function (b) {
      b.onclick = function () { state.dtab = b.dataset.dt; renderDetail(); };
    });
    syncWide();
  }

  function fieldCard(fd, srcTag) {
    var h = '<div class="fld"><div class="fh"><span class="fn">' + esc(fd.name || "(未命名)") + "</span>";
    if (fd.required) h += '<span class="req" title="必填">*</span>';
    h += '<span class="pill">' + esc(fd.typeText || "?") + "</span>";
    if (fd.isKeyNode) h += '<span class="pill gold">关键节点</span>';
    if (fd.isHidden) h += '<span class="pill red">隐藏</span>';
    if (fd.showInPublic) h += '<span class="pill green">公开</span>';
    h += "</div>";
    var bs = [];
    if (srcTag) bs.push('<span class="qbadge">' + esc(srcTag) + "</span>");
    if (fd.unit) bs.push('<span class="pill">单位 ' + esc(fd.unit) + "</span>");
    if (fd.placeholder) bs.push('<span class="pill">占位：' + esc(fd.placeholder) + "</span>");
    if (fd.decimalNum != null) bs.push('<span class="pill">小数 ' + fd.decimalNum + " 位</span>");
    if (fd.isCheckBox) bs.push('<span class="pill">复选框</span>');
    if (fd.formula) bs.push('<span class="pill purple">公式 ' + esc(fd.formula) + "</span>");
    if (fd.quote) {
      var qf = flowById[fd.quote.applicationId];
      bs.push('<span class="pill blue">引用 ← ' + esc(qf ? qf.name : "流程 " + fd.quote.applicationId)
        + (fd.quote.fieldId ? " / 字段 " + fd.quote.fieldId : "") + "</span>");
    }
    if (bs.length) h += '<div class="fb">' + bs.join("") + "</div>";
    if (fd.noticeContent) h += '<div class="tip">' + esc(fd.noticeContent) + "</div>";
    if (fd.options && fd.options.length) {
      h += '<div class="opts">' + fd.options.map(function (o) {
        return '<span class="opt">' + esc(o.name) + "</span>";
      }).join("") + "</div>";
    }
    h += "</div>";
    return h;
  }

  function dFields(f, s) {
    var h = "";
    if (s.description) {
      h += '<div class="blk"><h3>步骤说明</h3><div class="descbox">' + hi(s.description) + "</div></div>";
    }
    var fm = null;
    (f.forms || []).forEach(function (x) { if (x.id === s.formId) fm = x; });

    h += '<div class="blk"><h3>审核项字段 <span class="pill">' + s.fieldCount + " 个</span></h3>";
    if (s.fields && s.fields.length) {
      s.fields.forEach(function (fd) { h += fieldCard(fd); });
    } else h += '<div class="footnote">该步骤未配置审核项字段。</div>';
    h += "</div>";

    if (fm && fm.fields && fm.fields.length) {
      h += '<div class="blk"><h3>表单「' + esc(fm.name) + '」字段 <span class="pill">' + fm.fieldCount + " 个</span></h3>";
      fm.fields.forEach(function (fd) { h += fieldCard(fd, "表单"); });
      h += "</div>";
    }
    return h;
  }

  function dCond(s) {
    if (!s.conditionCount) {
      return '<div class="blk"><h3>条件审核</h3><div class="footnote">该步骤为 <b>'
        + esc(s.auditModeText || "简单审核") + '</b>，未配置条件分支。<br>'
        + "所有情形都进入同一套审核项" + (s.approverSummary ? "（" + esc(s.approverSummary) + "）" : "") + "。</div></div>";
    }
    var h = "";
    s.conditions.forEach(function (c) {
      h += '<div class="condbox"><div class="ch">条件组 #' + esc(c.id)
        + '<span class="ct">' + esc(c.conditionTypeText || c.conditionType || "") + "</span>"
        + '<span class="ct">' + c.conditionCount + " 项条件</span></div>";
      h += '<div style="font-size:11px;color:var(--mu);margin-bottom:6px">当满足以下条件：</div>';
      (c.conditions || []).forEach(function (cd) {
        h += '<div class="cterm"><span class="cn">' + esc(cd.name) + "</span>";
        if (cd.typeText && cd.typeText !== cd.name) h += '<span class="pill">' + esc(cd.typeText) + "</span>";
        if (cd.ruleText) h += "<span>" + esc(cd.ruleText) + "</span>";
        if (cd.valueText) h += '<span class="cv">' + esc(cd.valueText) + "</span>";
        else if (cd.value) h += '<span class="cv">' + esc(cd.value) + "</span>";
        if (cd.originStepName) h += '<span class="pill">来自步骤「' + esc(cd.originStepName) + "」</span>";
        h += "</div>";
      });
      h += '<div style="font-size:11px;color:var(--mu);margin:9px 0 4px">进行如下审核项：</div>';
      (c.auditNodes || []).forEach(function (n) {
        h += '<div class="noderow"><span class="nodego">▸</span><div style="flex:1;min-width:0">';
        h += '<div class="nn">' + esc(n.name || "(未命名审核项)") + "</div>";
        h += '<div class="nd">' + esc(n.optionText || "—");
        if (n.isOpenLimitTime) h += " · 限时 " + esc(n.limitTime || "");
        if (n.leaderLevel) h += " · 上级层级 " + esc(n.leaderLevel);
        h += "</div>";
        (n.approvers || []).forEach(function (a) {
          h += '<div class="nd">审批人：' + (a.userId ? personLabel(a) : esc(a.name || a.kind || "—"))
            + (a.kind && a.userId ? ' <span class="pill">' + esc(a.kind) + "</span>" : "") + "</div>";
        });
        if (n.ccUsers && n.ccUsers.length) {
          h += '<div class="nd">抄送 ' + n.ccUsers.length + " 人：" + avatars(n.ccUsers, 8) + "</div>";
        }
        h += "</div></div>";
      });
      h += "</div>";
    });
    return h;
  }

  function dFlowline(f, s) {
    var h = '<div class="blk"><h3>流转位置</h3>';
    var idx = -1;
    f.steps.forEach(function (x, i) { if (x.id === s.id) idx = i; });
    var prev = idx > 0 ? f.steps[idx - 1] : null;
    var next = idx < f.steps.length - 1 ? f.steps[idx + 1] : null;
    h += '<div class="kv"><span class="k">上一步</span><span class="v">'
      + (prev ? esc(prev.order + ". " + prev.name) : '<span style="color:var(--mu2)">流程起点</span>') + "</span></div>";
    h += '<div class="kv"><span class="k">当前</span><span class="v" style="color:var(--tx);font-weight:600">'
      + esc(s.order + ". " + s.name) + "</span></div>";
    h += '<div class="kv"><span class="k">下一步</span><span class="v">'
      + (next ? esc(next.order + ". " + next.name) : '<span style="color:var(--mu2)">流程终点</span>') + "</span></div>";
    h += '<div class="kv"><span class="k">流转方式</span><span class="v"><span class="pill green">线性顺序</span>'
      + (s.conditionCount ? ' <span class="pill purple">含条件审核分支</span>' : "") + "</span></div>";
    if (s.beforeSteps && s.beforeSteps.length) {
      h += '<div class="kv"><span class="k">前置步骤</span><span class="v">'
        + s.beforeSteps.map(function (b) { return esc(b.name); }).join("、") + "</span></div>";
    }
    h += "</div>";

    h += '<div class="blk"><h3>执行与时限</h3>';
    h += '<div class="kv"><span class="k">执行人</span><span class="v">'
      + ((s.executors || []).length ? s.executors.map(personLabel).join("、")
        : (s.conditionCount ? '<span style="color:#a072ff">按条件指定，见「条件审核」页</span>'
          : '<span style="color:var(--mu2)">未指定</span>')) + "</span></div>";
    if (s.limitTime) {
      h += '<div class="kv"><span class="k">限时</span><span class="v">' + esc(s.limitTime.text)
        + '　<span class="pill">' + esc(s.limitTime.typeText || "") + "起算</span></span></div>";
    }
    if (s.limitUsers && s.limitUsers.length) {
      h += '<div class="kv"><span class="k">限定执行范围</span><span class="v">' + s.limitUsers.map(personLabel).join("、") + "</span></div>";
    }
    if (s.flagTexts && s.flagTexts.length) {
      h += '<div class="kv"><span class="k">操作限制</span><span class="v">'
        + s.flagTexts.map(function (t) { return '<span class="pill orange">' + esc(t) + "</span>"; }).join(" ") + "</span></div>";
    }
    h += "</div>";
    return h;
  }

  function dRaw(s) {
    var rows = [
      ["步骤 ID", s.id], ["显示顺序", s.order], ["步骤类型", s.stepType],
      ["审核模式", (s.auditModeText || "") + "（auditMode=" + s.auditMode + "）"],
      ["表单 ID", s.formId], ["表单名称", s.formName],
      ["审核字段数", s.fieldCount], ["关键节点字段", s.keyFieldCount],
      ["条件组数", s.conditionCount], ["审批节点", s.approverSummary],
      ["执行人 userIds", s.executorRawIds], ["限定执行人", s.limitUserIds],
      ["创建时间", s.dateCreated], ["最后更新", s.lastUpdated]
    ];
    var h = '<div class="blk"><h3>原始字段</h3>';
    rows.forEach(function (r) {
      if (r[1] == null || r[1] === "") return;
      h += '<div class="kv"><span class="k">' + esc(r[0]) + '</span><span class="v' +
        (/ID|userIds/.test(r[0]) ? " mono" : "") + '">' + esc(r[1]) + "</span></div>";
    });
    h += "</div>";
    h += '<div class="blk"><h3>限时原始值</h3><div class="descbox">'
      + esc(JSON.stringify(s.limitTime || {}, null, 1)) + "</div></div>";
    return h;
  }

  /* ---------- views ---------- */
  function viewOverview() {
    var h = '<h1 class="pt">数据总览</h1><div class="pmeta">导出时间 ' + esc(M.exportedAt)
      + " · 数据源 " + esc(M.source) + "</div>";
    h += '<div class="cards">'
      + card("g", M.starProjectCount, "星标项目") + card("b", M.starFlowCount, "星标流程")
      + card("gr", M.starStepCount, "星标步骤") + card("p", M.starFieldCount, "星标审核字段")
      + card("", M.allProjectCount, "已抓取项目") + card("", M.allFlowCount, "已抓取流程")
      + card("", M.allStepCount, "全部步骤") + card("", M.formFieldCount, "全部表单字段")
      + "</div>";
    h += '<h2 class="sec">分组分布 <span class="tag">已抓取 / 平台显示</span></h2>';
    h += "<table><thead><tr><th>分组</th><th class=\"num\">已抓取项目</th><th class=\"num\">平台显示</th><th>说明</th></tr></thead><tbody>";
    (D.groups || []).forEach(function (g) {
      var diff = g.uiCount && g.uiCount !== g.crawledCount;
      h += "<tr><td>" + (g.isStar ? "★ " : "") + esc(g.name) + '</td><td class="num">' + g.crawledCount
        + '</td><td class="num">' + (g.uiCount == null ? "—" : g.uiCount) + "</td><td>"
        + (diff ? '<span class="pill orange">接口未返回全部</span>' : '<span class="pill green">完整</span>')
        + "</td></tr>";
    });
    h += "</tbody></table>";

    h += '<h2 class="sec">全部流程 <span class="tag">' + M.allFlowCount + " 条</span></h2>";
    h += "<table><thead><tr><th>流程</th><th>项目</th><th class=\"num\">步骤</th><th class=\"num\">字段</th>"
      + "<th class=\"num\">条件审核</th><th>标记</th></tr></thead><tbody>";
    (D.flows || []).forEach(function (f) {
      var cc = (f.steps || []).reduce(function (a, s) { return a + (s.conditionCount || 0); }, 0);
      h += '<tr><td><span class="link" data-a="' + f.applicationId + '">' + esc(f.name) + "</span></td>";
      h += "<td>" + esc((f.usedIn || []).map(function (u) { return u.projectName; }).join("、")) + "</td>";
      h += '<td class="num">' + f.stepCount + '</td><td class="num">' + f.fieldCount + "</td>";
      h += '<td class="num">' + (cc || "—") + "</td>";
      h += "<td>" + (f.isStarFlow ? '<span class="pill gold">★ 星标</span>' : '<span class="pill">上下文</span>') + "</td></tr>";
    });
    h += "</tbody></table>";
    return h;
  }

  function viewFieldTypes() {
    var h = '<h1 class="pt">字段类型对照表</h1><div class="pmeta">取自功倍前端 bundle 的枚举定义，'
      + "用于翻译接口返回的数字类型（type）</div>";
    var used = {};
    (D.flows || []).forEach(function (f) {
      (f.steps || []).forEach(function (s) {
        (s.fields || []).forEach(function (fd) { used[fd.type] = (used[fd.type] || 0) + 1; });
      });
    });
    h += '<table><thead><tr><th class="num">type</th><th>中文标签</th><th>英文枚举</th>'
      + '<th class="num">本批出现</th></tr></thead><tbody>';
    Object.keys(FT).sort(function (a, b) { return (+a) - (+b); }).forEach(function (k) {
      var v = FT[k];
      h += '<tr><td class="num">' + k + "</td><td>" + esc(v.label) + '</td><td class="mono">'
        + esc(v.enum) + '</td><td class="num">' + (used[k] || "—") + "</td></tr>";
    });
    h += "</tbody></table>";
    return h;
  }

  function viewUsers() {
    var us = D.users || [];
    var h = '<h1 class="pt">执行人索引</h1><div class="pmeta">共 ' + us.length
      + " 位人员出现在流程的执行人 / 审批人 / 抄送位置。功倍接口仅返回企业微信脱敏 ID（openuserid），"
      + "真实姓名由前端解密，故此处以头像 + ID 标识。</div>";
    h += '<table><thead><tr><th class="num">#</th><th>标识</th><th>openuserid</th>'
      + '<th class="num">出现次数</th></tr></thead><tbody>';
    us.forEach(function (u, i) {
      h += '<tr><td class="num">' + (i + 1) + "</td><td>" + avatar(u)
        + '</td><td class="mono">' + esc(u.userId) + '</td><td class="num">' + u.roleCount + "</td></tr>";
    });
    h += "</tbody></table>";
    return h;
  }

  function viewNotes() {
    var h = '<h1 class="pt">说明与局限</h1><div class="pmeta">数据可核验性声明</div>';
    h += '<h2 class="sec">已验证 <span class="tag">' + (M.verification || []).length + " 项</span></h2><ul class=\"footnote\">";
    (M.verification || []).forEach(function (x) { h += "<li>" + esc(x) + "</li>"; });
    h += "</ul>";
    h += '<h2 class="sec">已知局限 <span class="tag">' + (M.limitations || []).length + " 项</span></h2><ul class=\"footnote\">";
    (M.limitations || []).forEach(function (x) { h += "<li>" + esc(x) + "</li>"; });
    h += "</ul>";
    h += '<h2 class="sec">口径说明</h2><ul class="footnote">';
    (M.notes || []).forEach(function (x) { h += "<li>" + esc(x) + "</li>"; });
    h += "</ul>";
    h += '<div class="hr"></div><h2 class="sec">数据来源</h2><div class="footnote">'
      + "页面：<code>" + esc(M.source) + "</code><br>入口：" + esc(M.sourceUrl) + "</div>";
    return h;
  }

  /* ---------- search ---------- */
  var qEl = document.getElementById("q");
  var tmr = null;
  qEl.addEventListener("input", function () {
    clearTimeout(tmr);
    tmr = setTimeout(function () {
      state.q = qEl.value.trim();
      var hint = document.getElementById("qhint");
      if (!state.q) { hint.textContent = ""; renderTree(); renderMain(); renderDetail(); return; }
      var res = searchAll(state.q.toLowerCase());
      var tot = res.reduce(function (a, r) { return a + r.steps.reduce(function (x, s) { return x + s.hits.length; }, 0); }, 0);
      hint.textContent = "命中 " + res.length + " 条流程 / " + tot + " 处匹配";
      renderTree(); renderMain(); renderDetail();
    }, 180);
  });

  document.querySelectorAll("#viewTabs button").forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll("#viewTabs button").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      state.view = b.dataset.v;
      renderMain(); renderDetail();
    };
  });

  renderKPI(); renderTree(); renderMain(); renderDetail();
})();

</script>
</body>
</html>
